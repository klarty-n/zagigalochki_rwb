# Standalone file: do NOT merge with the development compose/override.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hack
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C --auth-host=scram-sha-256
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${PG_SERVER_PORT:-5432}:5432"
    volumes:
      - server_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hack -d marketplace']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
secrets:
  postgres_password:
    file: ./secrets/postgres_password
volumes:
  server_pgdata:
